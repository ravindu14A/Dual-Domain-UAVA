num_motors: 6
# battery_capacity: 5000 # Wh
battery_efficiency: 0.9 # Efficiency factor for battery discharge
battery_weight_fraction: 0.45 # Fraction of drone weight that is battery
battery_specific_energy: 200 # Wh/kg

motor_voltage: 11.1 # V
drone:
  weight: 15 # kg
  drag_coefficient: 0.3

air_density: 1.225 # kg/m^3
propeller_diameter: 0.6 # meters
hover_efficiency: 0.7 # Efficiency factor for hover power calculation

max_thrust_per_motor: 40 # N

motor_power_consumption:
  - 0:
    power: 0
    thrust: 0 # N
  - 10:
    power: 100 # W
    thrust: 10 # N
  - 20:
    power: 200 # W
    thrust: 20 # N
  - 30:
    power: 300 # W
    thrust: 30 # N
  - 40:
    power: 400 # W
    thrust: 40 # N
  - 50:
    power: 500 # W
    thrust: 50 # N
  - 60:
    power: 600 # W
    thrust: 60 # N
  - 70:
    power: 700 # W
    thrust: 70 # N
  - 80:
    power: 800 # W
    thrust: 80 # N
  - 90:
    power: 900 # W
    thrust: 90 # N
  - 100:
    power: 1000 # W
    thrust: 100 # N

mission_profile:
  - time: 0 # seconds
    action: hover
  - time: 60 # seconds
    action: forward_flight
  - time: 120 # seconds
    action: ascent
  - time: 180 # seconds
    action: descent
